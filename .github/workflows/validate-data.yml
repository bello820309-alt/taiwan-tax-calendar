name: Validate tax deadline data

on:
  push:
    paths:
      - 'data/tax_deadlines.csv'
      - '.github/workflows/validate-data.yml'
      - 'scripts/validate_tax_deadlines.py'
  pull_request:
    paths:
      - 'data/tax_deadlines.csv'
      - '.github/workflows/validate-data.yml'
      - 'scripts/validate_tax_deadlines.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-csv:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate CSV
        run: python scripts/validate_tax_deadlines.py
